services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecowatt
      POSTGRES_USER: ecowatt
      POSTGRES_PASSWORD: ecowatt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecowatt -d ecowatt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ecowatt:ecowatt@db:5432/ecowatt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

